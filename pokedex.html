

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>  
    <header>
        <button id="anterior" type="button">◀</button>

        <h1>Pokédex</h1>

        <form id="form-busca">
            <input type="text" id="campo-busca" placeholder="Nome ou número...">
            <button type="submit">Buscar</button>
        </form>

        <span id="numero-pokedex">Nº ---</span>

        <button id="proximo" type="button">▶</button>
    </header>

    <main>
        <section id="cartao-pokemon">

            <div id="identificacao">
                <h2 id="nome-pokemon">Nome do Pokémon</h2>
                <div id="tipos-pokemon">
                </div>
            </div>

            <div id="area-imagem">
                <img id="imagem-pokemon" src="" alt="Sprite do Pokémon">
            </div>


            <h3>Informações</h3>

            <div class="informacoes-pokemon">
                <p>Altura: <span id="altura-pokemon"></span></p>
                <p>Peso: <span id="peso-pokemon"></span></p>
            </div>


            <section id="atributos">
                <h3>Atributos</h3>

                <div class="atributo">
                    <div class="atributo-info">
                        <span>Vida</span>
                        <span id="vida">--</span>
                    </div>

                    <div class="barra">
                        <div id="vida-barra" class="dentro-barra"></div>
                    </div>
                </div>

                <div class="atributo">
                    <div class="atributo-info">
                        <span>Ataque</span>
                        <span id="ataque">--</span>
                    </div>

                    <div class="barra">
                        <div id="ataque-barra" class="dentro-barra"></div>
                    </div>
                </div>

                <div class="atributo">
                    <div class="atributo-info">
                        <span>Defesa</span>
                        <span id="defesa">--</span>
                    </div>

                    <div class="barra">
                        <div id="defesa-barra" class="dentro-barra"></div>
                    </div>
                </div>

                <div class="atributo">
                    <div class="atributo-info">
                        <span>Ataque Especial</span>
                        <span id="ataque-sp">--</span>
                    </div>

                    <div class="barra">
                        <div id="ataque-sp-barra" class="dentro-barra"></div>
                    </div>
                </div>

                <div class="atributo">
                    <div class="atributo-info">
                        <span>Defesa Especial</span>
                        <span id="defesa-sp">--</span>
                    </div>


                    <div class="barra">
                        <div id="defesa-sp-barra" class="dentro-barra"></div>
                    </div>
                </div>

                <div class="atributo">
                    <div class="atributo-info">
                        <span>Velocidade</span>
                        <span id="velocidade">--</span>
                    </div>

                    <div class="barra">
                        <div id="velocidade-barra" class="dentro-barra"></div>
                    </div>
                </div>
            </section>

            <footer>
                <button id="shiny" type="button" aria-label="Alternar Pokémon shiny">
                    ☆
                </button>

                <button id="aleatorio" type="button">
                    Pokémon aleatório
                </button>
            </footer>

        </section>
    </main>

    <script src="script.js"></script>

</body>

</html>
